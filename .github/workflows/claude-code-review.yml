name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      # 代码审查插件取自 anthropics/claude-code 的固定提交（插件市场的 URL 只接受 .git 结尾、不能带提交号，故先取到本地目录，
      # 以本地路径作插件市场）。Dependabot 不会提升级这一处，更新时手动换下面的提交号
      - name: Fetch code review plugin (pinned)
        env:
          PLUGIN_REPO: https://github.com/anthropics/claude-code.git
          PLUGIN_SHA: 6160717d8994f236ab381cf534fc1cde5347c12f
        run: |
          git init -q "$RUNNER_TEMP/claude-code-plugins"
          git -C "$RUNNER_TEMP/claude-code-plugins" fetch -q --depth 1 "$PLUGIN_REPO" "$PLUGIN_SHA"
          git -C "$RUNNER_TEMP/claude-code-plugins" checkout -q --detach "$PLUGIN_SHA"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1.0.238
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: '${{ runner.temp }}/claude-code-plugins'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

